name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare site
        run: |
          mkdir -p _site/template
          cp static/index.html _site/index.html
          cp static/og-image.png _site/og-image.png
          cp .devcontainer/devcontainer.json _site/template/devcontainer.json
          cp .devcontainer/Dockerfile _site/template/Dockerfile
          cp .devcontainer/managed-settings.json _site/template/managed-settings.json
          cp .devcontainer/init-firewall.sh _site/template/init-firewall.sh
          cp .devcontainer/refresh-firewall-dns.sh _site/template/refresh-firewall-dns.sh
          cp .devcontainer/firewall-allowed-domains.conf _site/template/firewall-allowed-domains.conf

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
